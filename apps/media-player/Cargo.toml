[package]
name = "nixe-media-player"
version = "0.1.0"
description = "A video player for Omarchy: movies and TV shows library, playlists, subtitles and an equalizer, played with mpv"
license = "MIT"
repository = "https://github.com/design-nexus/nixe-media-player"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nixe-media-player"
path = "src/main.rs"

[dependencies]
nixe-playback = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
nixe-core = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-core", rev = "e4595e68a4fd9b44bd15e95311ace1d0fb669bc4" }
nixe-ui = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
nixe-theme = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
anyhow = "1.0.104"
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5"
zbus = "5"
